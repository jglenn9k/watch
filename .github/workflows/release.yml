name: Binary release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION_NAME: ${{ github.ref_name }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SAMSUNG_HEALTH_SENSOR_AAR_BASE64: ${{ secrets.SAMSUNG_HEALTH_SENSOR_AAR_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Select provider flavor
        run: |
          if [ -n "$SAMSUNG_HEALTH_SENSOR_AAR_BASE64" ]; then
            printf '%s' "$SAMSUNG_HEALTH_SENSOR_AAR_BASE64" | base64 --decode > sensor-provider/libs/samsung-health-sensor-api.aar
            echo "PROVIDER_VARIANT=samsung" >> "$GITHUB_ENV"
          else
            echo "PROVIDER_VARIANT=demo" >> "$GITHUB_ENV"
          fi
      - name: Strip tag prefix
        run: echo "RELEASE_VERSION_NAME=${RELEASE_VERSION_NAME#v}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon :sensor-provider:testDemoDebugUnitTest
      - name: Build signed APKs and bundles
        run: |
          if [ "$PROVIDER_VARIANT" = samsung ]; then
            ./gradlew --no-daemon :watchface:assembleRelease :watchface:bundleRelease :sensor-provider:assembleSamsungRelease :sensor-provider:bundleSamsungRelease
          else
            ./gradlew --no-daemon :watchface:assembleRelease :watchface:bundleRelease :sensor-provider:assembleDemoRelease :sensor-provider:bundleDemoRelease
          fi
      - name: Package release
        run: |
          scripts/package-release.sh "$PROVIDER_VARIANT" release
          echo "$PROVIDER_VARIANT" > release/PROVIDER_VARIANT
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviator-watch-${{ github.ref_name }}
          retention-days: 30
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            Wear OS watch face and sensor provider.

            Verify downloads using `SHA256SUMS`. `PROVIDER_VARIANT` records whether this release contains the Samsung or demo SpO₂ implementation.
