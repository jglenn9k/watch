name: Binary release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION_NAME: ${{ github.ref_name }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Strip tag prefix
        run: echo "RELEASE_VERSION_NAME=${RELEASE_VERSION_NAME#v}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon :sensor-provider:testDebugUnitTest
      - name: Build signed APKs and bundles
        run: ./gradlew --no-daemon :watchface:assembleRelease :watchface:bundleRelease :sensor-provider:assembleRelease :sensor-provider:bundleRelease
      - name: Package release
        run: |
          scripts/package-release.sh release
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviator-watch-${{ github.ref_name }}
          retention-days: 30
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            Wear OS watch face and sensor provider.

            Verify downloads using `SHA256SUMS`. Assign Samsung Health's Blood oxygen complication to the SpO₂ slot.
