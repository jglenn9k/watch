name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25.0.4"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Unit tests and debug builds
        run: ./gradlew --no-daemon :sensor-provider:testDemoDebugUnitTest :sensor-provider:assembleDemoDebug :watchface:assembleDebug
      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: aviator-watch-debug-${{ github.sha }}
          retention-days: 14
          path: |
            watchface/build/outputs/apk/debug/watchface-debug.apk
            sensor-provider/build/outputs/apk/demo/debug/sensor-provider-demo-debug.apk
